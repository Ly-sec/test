name: Label Issue By Compositor

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  label-compositor:
    runs-on: ubuntu-latest
    steps:
      - name: Apply compositor label from issue form
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";
            const issueNumber = issue.number;
            const { owner, repo } = context.repo;

            const match = body.match(/### Desktop environment \/ compositor\s*\n+([^\n\r]+)/i);
            if (!match) {
              core.info("Compositor field not found in issue body; skipping.");
              return;
            }

            const value = match[1].trim();
            const labelMap = {
              "Niri": "compositor:niri",
              "Hyprland": "compositor:hyprland",
              "Sway": "compositor:sway",
              "Scroll": "compositor:scroll",
              "Labwc": "compositor:labwc",
              "MangoWC": "compositor:mangowc"
            };

            const targetLabel = labelMap[value];
            if (!targetLabel) {
              core.info(`No label mapping found for compositor value: "${value}"`);
              return;
            }

            async function ensureLabelExists(name) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: "5319e7",
                  description: "Issue reported for this compositor/desktop stack"
                });
                core.info(`Created missing label "${name}".`);
              }
            }

            await ensureLabelExists(targetLabel);

            const existingLabels = issue.labels.map((label) => label.name);
            const compositorLabels = existingLabels.filter((name) => name.startsWith("compositor:"));

            for (const label of compositorLabels) {
              if (label === targetLabel) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: label
                });
              } catch (error) {
                core.info(`Could not remove label "${label}": ${error.message}`);
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: [targetLabel]
            });

            core.info(`Applied label "${targetLabel}" from compositor value "${value}".`);
