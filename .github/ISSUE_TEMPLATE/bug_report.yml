name: Bug Report
description: Report a bug or regression in Noctalia Shell
title: "[BUG] "
labels: ["bug"]
assignees: [ly-sec, ItsLemmy]

body:
  - type: checkboxes
    id: submission-checklist
    attributes:
      label: Submission checklist
      description: Please confirm the following before submitting.
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I am using the latest available version of Noctalia Shell.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of the issue.
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps required to reproduce the issue.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: |
        Paste any relevant logs, terminal output, or stack traces here.

        Examples:
        - journalctl output
        - terminal errors
        - crash logs
        - browser console output (if applicable)

        Large outputs can be wrapped in a `<details>` block.
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment information
      description: |
        Please provide relevant system information:

        - Distribution:
        - Desktop environment / compositor:
        - Noctalia version or commit:
        - Installation method:
        - GPU / driver (if graphical issue):
      placeholder: |
        Distribution: Arch Linux
        Desktop environment: Hyprland
        Noctalia version: main / commit hash
        Installation method: AUR
        GPU: AMD RX 7800 XT (amdgpu)
      render: text
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Add any other context, screenshots, or relevant information here.